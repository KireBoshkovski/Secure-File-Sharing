version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: "file-sharing-angular-frontend"
    depends_on:
      - backend
#    ports:
#      - "4200:4200"
    networks:
      - network

  backend:
    build: ./backend
    container_name: "file-sharing-spring-backend"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
#    ports:
#      - "8080:8080"
    networks:
      - network

  proxy:
    build: ./nginx
    container_name: "file-sharing-nginx-proxy"
    restart: always
    ports:
      - "80:80"
    networks:
      - network

  db:
    image: postgres:15
    container_name: "file-sharing-postgres-db"
    restart: always
    env_file:
      - .env
#    ports:
#      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d file-sharing" ]
      interval: 10s
      retries: 5
      start_period: 5s

volumes:
  pg_data:

networks:
  network:
