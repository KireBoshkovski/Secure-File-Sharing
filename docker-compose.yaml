version: '3.8'

services:
  frontend:
    container_name: "file-sharing-angular-frontend"
    image: ${DOCKERHUB_USERNAME}/file-sharing-frontend:${BRANCH_NAME}-latest
    depends_on:
      - backend
    expose:
      - "4200"
    networks:
      - network

  backend:
    container_name: "file-sharing-spring-backend"
    image: ${DOCKERHUB_USERNAME}/file-sharing-backend:${BRANCH_NAME}-latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - network

  proxy:
    container_name: "file-sharing-nginx"
    image: ${DOCKERHUB_USERNAME}/file-sharing-nginx:${BRANCH_NAME}-latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - network

  db:
    image: postgres:15
    container_name: "file-sharing-postgres-db"
    restart: on-failure
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 5s

volumes:
  pg_data:

networks:
  network:
